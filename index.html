<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diseños Pablin — Panel de Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,500&family=Manrope:wght@400;500;600&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Librería Supabase JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --carbon: #1D1D1D;
    --sand: #F8F6F2;
    --sand-2: #F0EDE6;
    --gold: #B78652;
    --gold-light: #C99B68;
    --gold-dim: #DCCFBE;
    --stone: #7B7B7B;
    --border: #DCCFBE;
    --border-dark: #2E2E2E;
    --sidebar-w: 240px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--sand);
    color: var(--carbon);
    font-family: 'Manrope', sans-serif;
    font-size: 13px;
    display: flex;
    min-height: 100vh;
  }
  aside {
    width: var(--sidebar-w);
    background: var(--carbon);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    position: fixed;
    top: 0; bottom: 0; left: 0;
    z-index: 100;
    border-right: 1px solid var(--border-dark);
  }
  .brand {
    padding: 24px 20px 20px;
    border-bottom: 1px solid var(--border-dark);
  }
  .brand-name {
    font-family: 'Montserrat', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--sand);
  }
  .brand-tag {
    font-family: 'Montserrat', sans-serif;
    font-size: 8px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--gold);
    margin-top: 2px;
  }
  .nav-group { padding: 16px 0 8px; }
  .nav-label {
    font-family: 'Montserrat', sans-serif;
    font-size: 8px;
    font-weight: 700;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--stone);
    padding: 0 20px 8px;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 20px;
    color: var(--sand);
    opacity: 0.65;
    text-decoration: none;
    font-size: 12px;
    font-weight: 500;
    transition: all 0.15s;
    cursor: pointer;
    border-left: 2px solid transparent;
  }
  .nav-item:hover { opacity: 1; background: rgba(255,255,255,0.04); }
  .nav-item.active {
    opacity: 1;
    color: var(--gold);
    border-left-color: var(--gold);
    background: rgba(183,134,82,0.08);
  }
  .nav-item svg { width: 14px; height: 14px; flex-shrink: 0; }
  .sidebar-footer {
    margin-top: auto;
    padding: 16px 20px;
    border-top: 1px solid var(--border-dark);
    font-family: 'Montserrat', sans-serif;
    font-size: 8px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold);
  }
  .sidebar-user { font-size: 11px; font-weight: 600; color: var(--sand); margin-top: 2px; }
  main {
    margin-left: var(--sidebar-w);
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .topbar {
    height: 56px;
    background: #FFF;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .topbar-title {
    font-family: 'Montserrat', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--stone);
  }
  .content { padding: 28px; flex: 1; }
  .view { display: none; }
  .view.active { display: block; }
  .page-header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 24px;
  }
  .page-title {
    font-family: 'Montserrat', sans-serif;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--carbon);
  }
  .page-sub {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 14px;
    color: var(--stone);
    margin-top: 2px;
  }
  .btn {
    font-family: 'Montserrat', sans-serif;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding: 10px 18px;
    border-radius: 2px;
    border: none;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.15s;
  }
  .btn-bronze { background: var(--gold); color: #FFF; }
  .btn-bronze:hover { background: var(--gold-light); }
  .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--carbon); }
  .btn-outline:hover { background: var(--sand-2); border-color: var(--gold); }
  .btn-sm { padding: 6px 12px; font-size: 8px; }
  .card {
    background: #FFF;
    border: 1px solid var(--border);
    border-radius: 2px;
    margin-bottom: 20px;
  }
  .card-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .card-title {
    font-family: 'Montserrat', sans-serif;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--stone);
  }
  .table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .table th {
    text-align: left;
    padding: 10px 16px;
    font-family: 'Montserrat', sans-serif;
    font-size: 8px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--stone);
    border-bottom: 1px solid var(--border);
    background: var(--sand);
  }
  .table td { padding: 12px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .table tr:last-child td { border-bottom: none; }
  .table tr:hover td { background: rgba(248,246,242,0.6); }
  .avatar {
    width: 30px; height: 30px;
    background: var(--gold-dim);
    color: var(--gold);
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: 'Montserrat', sans-serif;
    font-size: 9px;
    font-weight: 700;
  }
  .badge {
    display: inline-block;
    padding: 3px 8px;
    font-family: 'Montserrat', sans-serif;
    font-size: 8px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    border-radius: 2px;
  }
  .badge-active { background: #E8F5E9; color: #2E7D32; }
  
  /* MODAL */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(29,29,29,0.5);
    z-index: 200;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: #FFF;
    border: 1px solid var(--border);
    width: 520px;
    max-width: 95vw;
    border-radius: 2px;
  }
  .modal-header {
    padding: 18px 22px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .modal-title {
    font-family: 'Montserrat', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }
  .modal-close { background: none; border: none; font-size: 16px; cursor: pointer; color: var(--stone); }
  .modal-body { padding: 22px; display: flex; flex-direction: column; gap: 14px; }
  .modal-footer {
    padding: 14px 22px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    background: var(--sand);
  }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-group { display: flex; flex-direction: column; gap: 5px; }
  .form-label {
    font-family: 'Montserrat', sans-serif;
    font-size: 8px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--stone);
  }
  .form-input, .form-select {
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 2px;
    font-size: 12px;
    font-family: 'Manrope', sans-serif;
    outline: none;
  }
  .form-input:focus, .form-select:focus { border-color: var(--gold); }
  
  /* TOAST NOTIFICACIÓN */
  .toast {
    position: fixed;
    bottom: 24px; right: 24px;
    background: var(--carbon);
    color: var(--sand);
    border-left: 3px solid var(--gold);
    padding: 12px 18px;
    font-size: 11px;
    border-radius: 2px;
    z-index: 300;
    display: none;
  }
  .toast.show { display: block; }
</style>
</head>
<body>

<aside>
  <div class="brand">
    <div class="brand-name">Diseños Pablin</div>
    <div class="brand-tag">Arte en Madera</div>
  </div>
  <div class="nav-group">
    <div class="nav-label">Principal</div>
    <div class="nav-item active" onclick="showView('dashboard')">Dashboard</div>
    <div class="nav-item" onclick="showView('clientes')">Clientes</div>
    <div class="nav-item" onclick="showView('obras')">Obras</div>
  </div>
  <div class="sidebar-footer">
    <div>Administrador</div>
    <div class="sidebar-user">Diseños Pablin</div>
  </div>
</aside>

<main>
  <div class="topbar">
    <div class="topbar-title" id="topbar-title">Clientes</div>
    <button class="btn btn-bronze" onclick="openModal('nuevo-cliente')">+ Nuevo Cliente</button>
  </div>

  <div class="content">
    <!-- VISTA CLIENTES -->
    <div class="view active" id="view-clientes">
      <div class="page-header">
        <div>
          <div class="page-title">Clientes</div>
          <div class="page-sub">Directorio conectado a Supabase</div>
        </div>
        <button class="btn btn-bronze" onclick="openModal('nuevo-cliente')">+ Nuevo Cliente</button>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="card-title">Listado de Clientes</div>
        </div>
        <table class="table">
          <thead>
            <tr>
              <th>Cliente</th>
              <th>Teléfono</th>
              <th>Cédula</th>
              <th>Tipo</th>
              <th>Fecha Registro</th>
            </tr>
          </thead>
          <tbody id="tabla-clientes-body">
            <tr>
              <td colspan="5" style="text-align:center;color:var(--stone);">Cargando clientes desde Supabase...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<!-- MODAL NUEVO CLIENTE -->
<div class="modal-overlay" id="modal-nuevo-cliente">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Nuevo Cliente</div>
      <button class="modal-close" onclick="closeModal('nuevo-cliente')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Nombres *</label>
          <input class="form-input" id="cli-nombres" placeholder="Ej: Roberto">
        </div>
        <div class="form-group">
          <label class="form-label">Apellidos *</label>
          <input class="form-input" id="cli-apellidos" placeholder="Ej: Mendoza">
        </div>
      </div>
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Número de Cédula *</label>
          <input class="form-input" id="cli-cedula" placeholder="0923456789">
        </div>
        <div class="form-group">
          <label class="form-label">Correo electrónico *</label>
          <input class="form-input" id="cli-correo" type="email" placeholder="cliente@correo.com">
        </div>
      </div>
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Teléfono / WhatsApp *</label>
          <input class="form-input" id="cli-telefono" placeholder="+593 99 000 0000">
        </div>
        <div class="form-group">
          <label class="form-label">Tipo de Cliente</label>
          <select class="form-select" id="cli-tipo">
            <option value="En obra">En obra</option>
            <option value="Prospecto">Prospecto</option>
            <option value="VIP">VIP</option>
            <option value="Finalizado">Finalizado</option>
          </select>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('nuevo-cliente')">Cancelar</button>
      <button class="btn btn-bronze" onclick="guardarNuevoCliente()">Guardar en Supabase</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"><span id="toast-msg">Mensaje</span></div>

<script>
  // 1. TUS CREDENCIALES CONFIGURADAS
  const SUPABASE_URL = 'https://ysupbkkivqacsqhfxrof.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_ygm_Ge0X3ogErxTRJu3y_w_i2Whpwe6';
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // 2. FUNCIÓN: GUARDAR CLIENTE DIRECTO EN SUPABASE
  async function guardarNuevoCliente() {
    const nombres = document.getElementById('cli-nombres')?.value.trim();
    const apellidos = document.getElementById('cli-apellidos')?.value.trim();
    const cedula = document.getElementById('cli-cedula')?.value.trim();
    const correo = document.getElementById('cli-correo')?.value.trim();
    const telefono = document.getElementById('cli-telefono')?.value.trim();
    const tipo = document.getElementById('cli-tipo')?.value || 'En obra';

    if (!nombres || !apellidos || !cedula || !correo || !telefono) {
      showToast('Por favor completa todos los campos con asterisco (*)');
      return;
    }

    showToast('Guardando en Supabase...');

    const { data, error } = await db.from('clientes').insert([{
      nombres: nombres,
      apellidos: apellidos,
      numero_cedula: cedula,
      correo_electronico: correo,
      telefono_1: telefono,
      tipo_cliente: tipo
    }]);

    if (error) {
      console.error(error);
      showToast('Error: ' + error.message);
    } else {
      closeModal('nuevo-cliente');
      // Limpiar campos del formulario
      document.getElementById('cli-nombres').value = '';
      document.getElementById('cli-apellidos').value = '';
      document.getElementById('cli-cedula').value = '';
      document.getElementById('cli-correo').value = '';
      document.getElementById('cli-telefono').value = '';
      
      showToast('¡Cliente registrado con éxito! ✓');
      cargarClientesDesdeSupabase();
    }
  }

  // 3. FUNCIÓN: CARGAR CLIENTES DE SUPABASE A LA TABLA
  async function cargarClientesDesdeSupabase() {
    const tbody = document.getElementById('tabla-clientes-body');
    
    const { data: clientes, error } = await db
      .from('clientes')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) {
      console.error(error);
      if (tbody) tbody.innerHTML = `<tr><td colspan="5" style="color:red;text-align:center;">Error cargando datos: ${error.message}</td></tr>`;
      return;
    }

    if (!clientes || clientes.length === 0) {
      if (tbody) tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;color:var(--stone);">No hay clientes registrados aún.</td></tr>`;
      return;
    }

    if (tbody) {
      tbody.innerHTML = clientes.map(cli => {
        const iniciales = (cli.nombres?.[0] || '') + (cli.apellidos?.[0] || '');
        const fecha = cli.created_at ? new Date(cli.created_at).toLocaleDateString('es-EC') : '-';
        return `
          <tr>
            <td>
              <div style="display:flex;align-items:center;gap:10px;">
                <div class="avatar">${iniciales.toUpperCase()}</div>
                <div>
                  <div style="font-weight:600;">${cli.nombres} ${cli.apellidos}</div>
                  <div style="font-size:11px;color:var(--stone);">${cli.correo_electronico}</div>
                </div>
              </div>
            </td>
            <td style="font-size:12px;color:var(--stone);">${cli.telefono_1}</td>
            <td style="font-weight:600;">${cli.numero_cedula}</td>
            <td><span class="badge badge-active">${cli.tipo_cliente || 'En obra'}</span></td>
            <td style="font-size:12px;color:var(--stone);">${fecha}</td>
          </tr>
        `;
      }).join('');
    }
  }

  // Inicialización al cargar la página
  window.addEventListener('DOMContentLoaded', () => {
    cargarClientesDesdeSupabase();
    document.querySelectorAll('.modal-overlay').forEach(o => {
      o.addEventListener('click', function(e) {
        if (e.target === this) this.classList.remove('open');
      });
    });
  });

  // Funciones de navegación
  function showView(name) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    const target = document.getElementById('view-' + name);
    if (target) target.classList.add('active');
    if (event?.currentTarget) event.currentTarget.classList.add('active');
    const titles = { dashboard:'Dashboard', clientes:'Clientes', obras:'Obras' };
    const titleEl = document.getElementById('topbar-title');
    if (titleEl) titleEl.textContent = titles[name] || name;
  }

  function openModal(id) { document.getElementById('modal-' + id)?.classList.add('open'); }
  function closeModal(id) { document.getElementById('modal-' + id)?.classList.remove('open'); }

  function showToast(msg) {
    const t = document.getElementById('toast');
    const msgEl = document.getElementById('toast-msg');
    if (msgEl) msgEl.textContent = msg;
    if (t) {
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3500);
    }
  }
</script>
</body>
</html>
